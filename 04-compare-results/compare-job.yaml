apiVersion: batch/v1
kind: Job
metadata:
  name: compare-results
  namespace: token-factory
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: compare
          image: python:3.12-slim
          command: ["python3", "-c"]
          args:
            - |
              import json, glob, os, re, csv

              LABELS = {
                  "01-g12-agg":     "01 agg, 1 GPU",
                  "02-g12-dspark":  "02 agg + DSpark, 1 GPU",
                  "03-g12-pd-1gpu": "03 PD + DSpark, 1 GPU",
                  "03-g12-pd-2gpu": "03 PD + DSpark, 2 GPU",
              }

              def pick(d, *names, default=None):
                  for n in names:
                      if n in d and d[n] is not None:
                          return d[n]
                  return default

              rows = []
              for path in sorted(glob.glob("/results/0[1-3]-g12-*-c*.json")):
                  try:
                      d = json.load(open(path))
                  except Exception as e:
                      print(f"!! bỏ qua {path}: {e}")
                      continue
                  if isinstance(d, list):
                      records = d
                  else:
                      records = [d]
                  for r in records:
                      name = os.path.basename(path)
                      lab = re.sub(r"-c\d+\.json$", "", name)
                      m = re.search(r"-c(\d+)\.json$", name)
                      conc = int(m.group(1)) if m else pick(r, "max_concurrency", default=0)
                      rows.append({
                          "lab":        LABELS.get(lab, lab),
                          "conc":       conc,
                          "ttft_p50":   pick(r, "median_ttft_ms", "p50_ttft_ms"),
                          "ttft_p99":   pick(r, "p99_ttft_ms"),
                          "tpot_p50":   pick(r, "median_tpot_ms", "p50_tpot_ms"),
                          "tpot_p99":   pick(r, "p99_tpot_ms"),
                          "itl_p50":    pick(r, "median_itl_ms", "p50_itl_ms"),
                          "itl_p99":    pick(r, "p99_itl_ms"),
                          "out_tps":    pick(r, "output_throughput", "output_token_throughput"),
                          "req_ps":     pick(r, "request_throughput"),
                      })

              if not rows:
                  print("Không tìm thấy file kết quả nào trong /results.")
                  print("Hãy chạy sweep-job của bài 01-03 trước.")
                  raise SystemExit(0)

              rows.sort(key=lambda x: (x["conc"], x["lab"]))

              def fmt(v):
                  return "—" if v is None else f"{v:.2f}"

              hdr = ["lab", "conc", "ttft_p50", "ttft_p99", "tpot_p50", "tpot_p99", "itl_p50", "itl_p99", "out_tps", "req_ps"]
              lines = []
              lines.append("| Cấu hình | Conc | TTFT p50 | TTFT p99 | TPOT p50 | TPOT p99 | ITL p50 | ITL p99 | Out tok/s | req/s |")
              lines.append("|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|")
              for r in rows:
                  lines.append("| " + " | ".join([r["lab"], str(r["conc"])] +
                               [fmt(r[k]) for k in hdr[2:]]) + " |")

              md = "\n".join(lines)
              print("\n" + md + "\n")

              base = {r["conc"]: r["tpot_p50"] for r in rows if r["lab"] == LABELS["01-g12-agg"]}
              if base:
                  print("### Tăng tốc TPOT p50 so với baseline (01 agg)\n")
                  sp = ["| Cấu hình | Conc | TPOT p50 | Tăng tốc |", "|---|---:|---:|---:|"]
                  for r in rows:
                      b = base.get(r["conc"])
                      if b and r["tpot_p50"]:
                          sp.append(f"| {r['lab']} | {r['conc']} | {fmt(r['tpot_p50'])} | {b / r['tpot_p50']:.2f}× |")
                  speed = "\n".join(sp)
                  print(speed + "\n")
                  md += "\n\n### Tăng tốc TPOT p50 so với baseline (01 agg)\n\n" + speed

              with open("/results/summary.md", "w") as f:
                  f.write("# Tổng hợp kết quả benchmark\n\n" + md + "\n")
              with open("/results/summary.csv", "w", newline="") as f:
                  w = csv.DictWriter(f, fieldnames=hdr)
                  w.writeheader()
                  w.writerows(rows)

              print("==> Đã ghi /results/summary.md và /results/summary.csv")
          volumeMounts:
            - name: bench-results
              mountPath: /results
          resources:
            requests: { cpu: "1", memory: 1Gi }
            limits:   { cpu: "2", memory: 2Gi }
      volumes:
        - name: bench-results
          persistentVolumeClaim:
            claimName: bench-results
