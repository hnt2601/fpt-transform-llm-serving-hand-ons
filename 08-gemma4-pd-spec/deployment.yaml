# Bài 08 — PD Disaggregation + assistant spec decode, Gemma-4-26B-A4B (MoE).
#
#   vllm-g4-p  : kv_producer, port 8001  -> 1 GPU
#   vllm-g4-d  : kv_consumer, port 8002  -> 1 GPU
#   vllm-g4-r  : vllm-router PD, port 30000 -> CPU
#
# TỈ LỆ 1P:1D — VÌ SAO KHÔNG PHẢI 2P:1D NHƯ BÀI 05
# -------------------------------------------------
# Bài 05 phải dùng 2P:1D vì prefill của Qwen3.8-27B DENSE là nút thắt
# nguồn cung: đo được 14.000 tok/s / 8.000 token mỗi prompt = 1,75 req/s,
# trong khi decode đòi 2,20 req/s ở c32. Một prefill không nuôi nổi decode.
#
# MoE lật ngược bài toán đó. FLOPs prefill tỉ lệ với ACTIVE params, không
# phải tổng params: ~4B thay vì 26B. Prefill rẻ đi khoảng 6,5 lần, nên
# nút thắt nguồn cung biến mất.
#
# Quan trọng hơn: với MoE ta CỐ Ý muốn ÍT engine decode nhưng TO. Thêm
# một engine D thứ hai sẽ CHIA ĐÔI batch decode — đẩy cả hai xuống vùng
# phẳng của đường cong MoE, đúng cái ta đang cố tránh. 1P:1D cho engine D
# thấy TOÀN BỘ concurrency.
#
# PHÉP SO SÁNH ĐÚNG là 1P1D (bài này) vs 2 replica agg của bài 06:
#
#              GPU   batch decode moi engine
#   agg x2      2     C/2 moi replica
#   1P 1D       2     C DAY DU tren D
#
# Dự đoán: PD thắng ĐẬM NHẤT ở concurrency TRUNG BÌNH — vùng mà C vượt
# ngưỡng phủ expert nhưng C/2 thì chưa. Ngược hẳn với model dense (bài
# 01-05), nơi agg càng thắng đậm khi tải tăng. Nếu đồ thị có hình dạng
# đó thì ta đã chứng minh được CƠ CHẾ, không chỉ một con số.
#
# ------------------------------------------------------------------
# GEMMA-4 DỄ HƠN QWEN3.8 Ở ĐÂU
#
#   Qwen3.8-27B lai: 48/64 lop Gated DeltaNet co CONV STATE -> bat buoc
#   VLLM_SSM_CONV_STATE_LAYOUT=DS, va conv state co kich thuoc CO DINH
#   theo request nen chi phi truyen KHONG amortize theo do dai prompt.
#
#   Gemma-4 la attention THUAN (sliding_attention 5:1 full_attention).
#   KHONG co conv state -> KHONG can bien moi truong do. Ngoai ra 25/30
#   lop bi chan o sliding_window=1024 nen KV rat nho -> chang truyen NIXL
#   re hon han.
# ------------------------------------------------------------------
#
# ĐIỀU KIỆN TIÊN QUYẾT: 2 GPU rảnh TRÊN CÙNG MỘT NODE (NVLink).
#   kubectl get nodes -o custom-columns=NAME:.metadata.name,GPU:.status.allocatable.'nvidia\.com/gpu'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-g4-p
  namespace: token-factory
  labels: { app: vllm-g4-p, lab: "08-gemma4-pd", pd-role: prefill }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-g4-p
  template:
    metadata:
      labels: { app: vllm-g4-p, lab: "08-gemma4-pd", pd-role: prefill }
    spec:
      enableServiceLinks: false
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.29.0
          imagePullPolicy: IfNotPresent
          command: ["vllm", "serve"]
          args:
            - /models/google/gemma-4-26B-A4B-it-fp8-dynamic
            - --served-model-name=gemma4-26b-a4b
            - --host=0.0.0.0
            - --port=8001
            - --trust-remote-code
            - --tensor-parallel-size=1
            - --gpu-memory-utilization=0.89
            - --max-model-len=131072
            # ---- KV cache dtype: KHONG dung fp8 o Phan 3 ----
            # Quy tac cung trong vllm/v1/attention/backends/fa_utils.py:306
            #   return (fa_version == 3 and SM90) or (fa_version == 4 and SM100)
            # tuc FP8 KV cache voi FLASH_ATTN chi hop le khi FA3+SM90 hoac
            # FA4+SM100. Gemma-4 co global_head_dim=512, ma FA3 chan o
            # head_size > 256, nen vLLM BUOC nang FA3 -> FA4 (fa_utils.py:127).
            # FA4 + SM90 (H100) + fp8 KV => bi loai tru:
            #   ValueError: Selected backend FLASH_ATTN is not valid.
            #   Reason: FP8 KV cache requires FA3 on SM90 or FA4 on SM100
            # Ep --flash-attn-version=3 cung vo ich: doan nang cap chay SAU
            # buoc override nen no lai quay ve 4.
            #
            # Doi lai: KV cache giam con khoang mot nua. Voi Gemma-4 van du
            # rong vi 25/30 layer bi chan o sliding_window=1024.
            # ---- attention-backend: BAT BUOC voi Gemma-4 tren H100 ----
            # Gemma-4 tach layer thanh NHIEU KV-cache group (sliding_window
            # 1024 cho 25/30 layer, full_attention cho 5 layer con lai). Khi
            # bat speculative decoding, vLLM chon FlashInfer cho group
            # sliding-window va engine chet ngay luc khoi dong:
            #   NotImplementedError: FlashInfer backend on SM90 currently
            #   crashes with sliding-window attention layers.
            # (flashinfer.py:887 chan cung khi window_left != -1 tren SM90;
            #  xem flashinfer-ai/flashinfer#3578)
            #
            # CAI BAY: bien moi truong VLLM_ATTENTION_BACKEND KHONG con ton
            # tai trong vLLM 0.29.0 - dat no se bi lo di AM THAM va engine
            # van crash y nguyen. Backend gio chi cau hinh duoc qua co
            # --attention-backend (hoac AttentionConfig.backend_per_kind cho
            # tung KV-cache group).
            #
            # Dat cho CA BA bai 06/07/08 de phep so sanh doi xung. Khong lam
            # lech ket qua: target von da chay FA4 = FLASH_ATTN, thay o log
            # bai 06 "Using FA4 for all layers to avoid mixed FA3/FA4 penalty".
            - --attention-backend=FLASH_ATTN

            # block-size 128 (mac dinh 16): KV di qua NIXL theo tung block.
            # Block lon -> it lan truyen, moi lan nhieu du lieu.
            # PHAI GIONG HET ben decode.
            - --block-size=128

            # ---- Toi uu RIENG cho prefill: it seq, moi seq rat dai ----
            - --max-num-batched-tokens=16384
            - --max-num-seqs=16
            - --enable-prefix-caching

            - '--limit-mm-per-prompt={"image":8,"video":0}'
            - --reasoning-parser=gemma4
            - --tool-call-parser=gemma4
            - --enable-auto-tool-choice

            # kv_load_failure_policy=fail -> loi truyen KV noi len RO RANG
            # thay vi am tham tinh lai prefill (se lam benchmark vo nghia).
            - '--kv-transfer-config={"kv_connector":"NixlConnector","kv_role":"kv_producer","kv_load_failure_policy":"fail"}'

            # PHAI GIONG HET decode du prefill khong dung toi drafter.
            # NIXL kiem tra "compatibility hash" cua cau hinh KV cache giua
            # hai engine. Lech cau hinh -> o bai 04 decode sinh ra RAC
            # (HTTP 200 kem chuoi "!ductductduct...") ma KHONG bao loi.
            # Day la loi nguy hiem nhat ca chuoi bai lab.
            - '--speculative-config={"method":"mtp","model":"/models/speculators/google/gemma-4-26B-A4B-it-assistant","num_speculative_tokens":4}'
          env:
            - name: HF_TOKEN
              valueFrom: { secretKeyRef: { name: hf-token, key: token } }
            # HOST phai la dia chi ma ben decode GOI TOI DUOC -> lay pod IP
            # qua downward API thay vi hardcode hostname.
            - name: VLLM_NIXL_SIDE_CHANNEL_HOST
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: VLLM_NIXL_SIDE_CHANNEL_PORT
              value: "5557"
            - name: UCX_NET_DEVICES
              value: "all"
            - name: GLOO_SOCKET_IFNAME
              value: "eth0"
            - name: NCCL_SOCKET_IFNAME
              value: "eth0"
            - name: VLLM_CACHE_ROOT
              value: /cache
          ports:
            - { name: http, containerPort: 8001 }
            - { name: nixl, containerPort: 5557 }
          resources:
            requests: { cpu: "6", memory: 48Gi, nvidia.com/gpu: 1 }
            limits:   { cpu: "12", memory: 64Gi, nvidia.com/gpu: 1 }
          volumeMounts:
            - { name: model-cache, mountPath: /models, readOnly: true }
            - { name: vllm-cache,  mountPath: /cache }
            - { name: shm,         mountPath: /dev/shm }
          startupProbe:
            httpGet: { path: /health, port: 8001 }
            failureThreshold: 120
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: 8001 }
            periodSeconds: 10
      volumes:
        - name: model-cache
          persistentVolumeClaim: { claimName: model-cache, readOnly: true }
        - name: vllm-cache
          persistentVolumeClaim: { claimName: vllm-cache }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 16Gi }
---
apiVersion: v1
kind: Service
metadata: { name: vllm-g4-p, namespace: token-factory }
spec:
  selector: { app: vllm-g4-p }
  ports:
    - { name: http, port: 8001, targetPort: 8001 }
    - { name: nixl, port: 5557, targetPort: 5557 }
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-g4-d
  namespace: token-factory
  labels: { app: vllm-g4-d, lab: "08-gemma4-pd", pd-role: decode }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-g4-d
  template:
    metadata:
      labels: { app: vllm-g4-d, lab: "08-gemma4-pd", pd-role: decode }
    spec:
      enableServiceLinks: false
      affinity:
        # UU TIEN dat decode CUNG NODE voi prefill de KV di qua NVLink thay
        # vi mang. Kiem tra topology bang 04-pd-disagg-dspark/00-nvlink-
        # check-job.yaml -> tim "NV#" giua GPU0 va GPU1.
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: { app: vllm-g4-p }
                topologyKey: kubernetes.io/hostname
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.29.0
          imagePullPolicy: IfNotPresent
          command: ["vllm", "serve"]
          args:
            - /models/google/gemma-4-26B-A4B-it-fp8-dynamic
            - --served-model-name=gemma4-26b-a4b
            - --host=0.0.0.0
            - --port=8002
            - --trust-remote-code
            - --tensor-parallel-size=1
            - --gpu-memory-utilization=0.89
            - --max-model-len=131072
            # ---- KV cache dtype: KHONG dung fp8 o Phan 3 ----
            # Quy tac cung trong vllm/v1/attention/backends/fa_utils.py:306
            #   return (fa_version == 3 and SM90) or (fa_version == 4 and SM100)
            # tuc FP8 KV cache voi FLASH_ATTN chi hop le khi FA3+SM90 hoac
            # FA4+SM100. Gemma-4 co global_head_dim=512, ma FA3 chan o
            # head_size > 256, nen vLLM BUOC nang FA3 -> FA4 (fa_utils.py:127).
            # FA4 + SM90 (H100) + fp8 KV => bi loai tru:
            #   ValueError: Selected backend FLASH_ATTN is not valid.
            #   Reason: FP8 KV cache requires FA3 on SM90 or FA4 on SM100
            # Ep --flash-attn-version=3 cung vo ich: doan nang cap chay SAU
            # buoc override nen no lai quay ve 4.
            #
            # Doi lai: KV cache giam con khoang mot nua. Voi Gemma-4 van du
            # rong vi 25/30 layer bi chan o sliding_window=1024.
            # ---- attention-backend: BAT BUOC voi Gemma-4 tren H100 ----
            # Gemma-4 tach layer thanh NHIEU KV-cache group (sliding_window
            # 1024 cho 25/30 layer, full_attention cho 5 layer con lai). Khi
            # bat speculative decoding, vLLM chon FlashInfer cho group
            # sliding-window va engine chet ngay luc khoi dong:
            #   NotImplementedError: FlashInfer backend on SM90 currently
            #   crashes with sliding-window attention layers.
            # (flashinfer.py:887 chan cung khi window_left != -1 tren SM90;
            #  xem flashinfer-ai/flashinfer#3578)
            #
            # CAI BAY: bien moi truong VLLM_ATTENTION_BACKEND KHONG con ton
            # tai trong vLLM 0.29.0 - dat no se bi lo di AM THAM va engine
            # van crash y nguyen. Backend gio chi cau hinh duoc qua co
            # --attention-backend (hoac AttentionConfig.backend_per_kind cho
            # tung KV-cache group).
            #
            # Dat cho CA BA bai 06/07/08 de phep so sanh doi xung. Khong lam
            # lech ket qua: target von da chay FA4 = FLASH_ATTN, thay o log
            # bai 06 "Using FA4 for all layers to avoid mixed FA3/FA4 penalty".
            - --attention-backend=FLASH_ATTN
            - --block-size=128

            # ---- Toi uu RIENG cho decode: batch RONG ----
            # Day la diem mau chot cua ca bai. Engine nay KHONG BAO GIO
            # chay prefill, nen toan bo 128 slot danh cho decode va batch
            # khong bao gio bi chunk prefill cat ngang. Voi MoE do la khac
            # biet giua "nam trong vung phang" va "da vuot nguong phu
            # expert".
            - --max-num-batched-tokens=2048
            - --max-num-seqs=128
            - --enable-prefix-caching

            # cudagraph_mode=FULL_DECODE_ONLY: engine nay khong chay prefill
            # nen chi can capture CUDA graph cho duong decode -> khoi dong
            # nhanh hon, it bo nho graph hon, va graph cua nhanh speculative
            # khong bi pha vo. Toi uu CHI CO THE lam khi da tach PD.
            - '--compilation-config={"cudagraph_mode":"FULL_DECODE_ONLY"}'

            - '--limit-mm-per-prompt={"image":8,"video":0}'
            - --reasoning-parser=gemma4
            - --tool-call-parser=gemma4
            - --enable-auto-tool-choice

            - '--kv-transfer-config={"kv_connector":"NixlConnector","kv_role":"kv_consumer","kv_load_failure_policy":"fail"}'
            - '--speculative-config={"method":"mtp","model":"/models/speculators/google/gemma-4-26B-A4B-it-assistant","num_speculative_tokens":4}'
          env:
            - name: HF_TOKEN
              valueFrom: { secretKeyRef: { name: hf-token, key: token } }
            - name: VLLM_NIXL_SIDE_CHANNEL_HOST
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: VLLM_NIXL_SIDE_CHANNEL_PORT
              value: "5558"          # PHAI khac prefill (5557)
            - name: UCX_NET_DEVICES
              value: "all"
            - name: GLOO_SOCKET_IFNAME
              value: "eth0"
            - name: NCCL_SOCKET_IFNAME
              value: "eth0"
            - name: VLLM_CACHE_ROOT
              value: /cache
          ports:
            - { name: http, containerPort: 8002 }
            - { name: nixl, containerPort: 5558 }
          resources:
            requests: { cpu: "6", memory: 48Gi, nvidia.com/gpu: 1 }
            limits:   { cpu: "12", memory: 64Gi, nvidia.com/gpu: 1 }
          volumeMounts:
            - { name: model-cache, mountPath: /models, readOnly: true }
            - { name: vllm-cache,  mountPath: /cache }
            - { name: shm,         mountPath: /dev/shm }
          startupProbe:
            httpGet: { path: /health, port: 8002 }
            failureThreshold: 150
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: 8002 }
            periodSeconds: 10
      volumes:
        - name: model-cache
          persistentVolumeClaim: { claimName: model-cache, readOnly: true }
        - name: vllm-cache
          persistentVolumeClaim: { claimName: vllm-cache }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 16Gi }
---
apiVersion: v1
kind: Service
metadata: { name: vllm-g4-d, namespace: token-factory }
spec:
  selector: { app: vllm-g4-d }
  ports:
    - { name: http, port: 8002, targetPort: 8002 }
    - { name: nixl, port: 5558, targetPort: 5558 }
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-g4-r
  namespace: token-factory
  labels: { app: vllm-g4-r, lab: "08-gemma4-pd" }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-g4-r
  template:
    metadata:
      labels: { app: vllm-g4-r, lab: "08-gemma4-pd" }
    spec:
      enableServiceLinks: false
      initContainers:
        # Router phai khoi dong SAU khi ca hai engine da ready.
        - name: wait-for-engines
          image: curlimages/curl:8.11.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              until curl -sf http://vllm-g4-p:8001/health; do
                echo "waiting for prefill..."; sleep 10; done
              until curl -sf http://vllm-g4-d:8002/health; do
                echo "waiting for decode...";  sleep 10; done
              echo "both engines ready"
      containers:
        - name: router
          image: vllm/vllm-openai:v0.29.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              if ! command -v vllm-router >/dev/null 2>&1; then
                echo "==> cai vllm-router"
                (command -v uv >/dev/null 2>&1 && uv pip install --system vllm-router) \
                  || pip install --no-cache-dir vllm-router
              fi
              exec vllm-router \
                --policy round_robin \
                --vllm-pd-disaggregation \
                --prefill http://vllm-g4-p:8001 \
                --decode  http://vllm-g4-d:8002 \
                --host 0.0.0.0 \
                --port 30000 \
                --intra-node-data-parallel-size 1
          ports:
            - { name: http, containerPort: 30000 }
          resources:
            requests: { cpu: "2", memory: 4Gi }
            limits:   { cpu: "4", memory: 8Gi }
          readinessProbe:
            tcpSocket: { port: 30000 }
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata: { name: vllm-g4-r, namespace: token-factory }
spec:
  selector: { app: vllm-g4-r }
  ports:
    - { name: http, port: 30000, targetPort: 30000 }
  type: ClusterIP
