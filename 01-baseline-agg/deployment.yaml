# Bài 01 — BASELINE: vLLM aggregated mode (prefill + decode trong 1 engine).
# 1× H100 80GB. Deploy: kubectl apply -f deployment.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-agg
  namespace: token-factory
  labels:
    app: vllm-agg
    lab: "01-baseline"
spec:
  replicas: 1
  # Recreate (khong phai RollingUpdate mac dinh): xoa pod cu XONG moi tao
  # pod moi. Voi RollingUpdate, K8s khoi dong pod moi TRUOC khi xoa pod cu
  # (maxSurge=1), nen ca hai cung xin GPU -> tren node 1 GPU pod moi se
  # ket Pending vinh vien va rollout khong bao gio xong.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-agg
  template:
    metadata:
      labels:
        app: vllm-agg
        lab: "01-baseline"
    spec:
      # K8s tự tiêm biến môi trường cho mọi Service trong namespace
      # (Service `vllm-agg` -> VLLM_AGG_SERVICE_HOST, VLLM_AGG_PORT, ...).
      # vLLM thấy prefix VLLM_ nên log 8 dòng WARNING "Unknown vLLM
      # environment variable" ngay lúc khởi động — vô hại nhưng gây hoang
      # mang. Tắt hẳn việc tiêm biến đó.
      enableServiceLinks: false
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.29.0   # workshop: image đã pull sẵn trên node
          imagePullPolicy: IfNotPresent
          command: ["vllm", "serve"]
          args:
            - /models/Qwen/Qwen3.8-27B-FP8
            - --served-model-name=qwen3.8-27b
            - --host=0.0.0.0
            - --port=8000
            - --trust-remote-code

            # ---- TP1: mỗi engine dùng ĐÚNG 1 GPU ----
            # Đặt tường minh dù 1 là mặc định — toàn chuỗi bài giữ TP1 để
            # mọi so sánh đều trên cùng một đơn vị phần cứng: 1 engine =
            # 1 GPU. Model FP8 chỉ 27.5GB nên thừa sức vừa 1 H100; TP2 chỉ
            # thêm chi phí all-reduce mà không giải quyết vấn đề gì.
            - --tensor-parallel-size=1

            # ---- Ngân sách bộ nhớ (H100 80GB) ----
            # 0.90 * 80GB = 72GB ; trọng số FP8 ~27.5GB -> KV cache ~40GB
            - --gpu-memory-utilization=0.90
            - --max-model-len=131072   # 128k (native 262k) - xem README về ngân sách KV
            - --kv-cache-dtype=fp8

            # ---- Scheduling: chunked prefill + prefix caching ----
            - --enable-prefix-caching
            - --max-num-batched-tokens=8192
            # 128 (khong phai 64): dat BANG --max-num-seqs cua decode trong
            # bai 04/05 de so sanh agg vs PD cong bang. Bat doi xung cau hinh
            # la mot nguon sai lech de bi bo qua.
            - --max-num-seqs=128

            # ---- Agentic coding: reasoning + tool calling ----
            - --reasoning-parser=qwen3
            - --tool-call-parser=qwen3_coder
            - --enable-auto-tool-choice
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            - name: VLLM_LOGGING_LEVEL
              value: "INFO"
            # Cache biên dịch torch.compile -> lần khởi động sau nhanh hơn nhiều
            # Cache torch.compile GHI vào PVC riêng — thư mục trọng số
            # được mount READ-ONLY (workshop dùng chung host path).
            - name: VLLM_CACHE_ROOT
              value: /cache
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "8"
              memory: 64Gi
              nvidia.com/gpu: 1
            limits:
              cpu: "16"
              memory: 96Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: model-cache
              mountPath: /models
              readOnly: true
            - name: vllm-cache
              mountPath: /cache
            - name: shm
              mountPath: /dev/shm
          # Model 27B mất vài phút để load + compile -> startupProbe nới rộng
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 120
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
            readOnly: true
        - name: vllm-cache
          persistentVolumeClaim:
            claimName: vllm-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-agg
  namespace: token-factory
  labels:
    app: vllm-agg
spec:
  selector:
    app: vllm-agg
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
