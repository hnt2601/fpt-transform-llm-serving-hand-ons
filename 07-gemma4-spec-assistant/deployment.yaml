# Bài 07 — Gemma-4-26B-A4B + speculative decoding bằng ASSISTANT drafter.
#
# Khác bài 06 đúng hai chỗ: --speculative-config và gpu-memory-utilization.
#
# DRAFTER: google/gemma-4-26B-A4B-it-assistant (839 MB, bf16)
# ---------------------------------------------------------------
# Đây KHÔNG phải một model nhỏ độc lập như draft model cổ điển. Đọc
# vllm/model_executor/models/gemma4_mtp.py sẽ thấy:
#
#   "The Gemma4 assistant model is a lightweight decoder that SHARES KV
#    CACHE with the target (backbone) model. All assistant decoder layers
#    are KV-shared: they only have Q projections (no K/V projections or
#    norms), and read K/V from the target model's cache at runtime."
#
# Cấu hình của nó: 4 layer, hidden_size 1024, enable_moe_block=false
# (drafter là DENSE — chỉ backbone mới là MoE), backbone_hidden_size 2816
# khớp với target. Nó nối vào backbone qua pre_projection/post_projection.
#
# vLLM 0.29.0 nhận diện checkpoint này ở config/speculative.py:981 —
# model_type "gemma4_assistant" được viết lại thành "gemma4_mtp" với
# n_predict=1, và num_kv_shared_layers bị ép về 0 vì việc chia sẻ KV
# giữa hai model do proposer dựng SAU khi model được khởi tạo.
# Vì "gemma4_mtp" nằm trong MTPModelTypes, vLLM lại rút gọn tiếp thành
# method="mtp" (dòng 1090-1094). Nên ta khai báo thẳng method:"mtp"
# kèm đường dẫn "model" tới assistant.
#
# VÌ SAO DRAFTER NÀY RẺ BẤT THƯỜNG
# ---------------------------------
# Drafter KHÔNG có KV cache riêng — nó đọc ké KV của target. So với bài
# 03 (DSpark, 4.0 GB checkpoint + KV riêng làm KV cache của target tụt
# từ 1.12 triệu xuống 550 nghìn token), ở đây cái giá gần như chỉ là
# 839 MB trọng số. Đó là lý do hạ gpu-memory-utilization rất nhẹ:
# 0.90 -> 0.89, thay vì 0.90 -> 0.86 như DSpark.
#
# 1x H100 80GB. Deploy: kubectl apply -f deployment.yaml
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-g4-spec
  namespace: token-factory
  labels:
    app: vllm-g4-spec
    lab: "07-gemma4-spec"
spec:
  replicas: 1
  # Recreate: xoa pod cu XONG moi tao pod moi. Voi RollingUpdate mac dinh,
  # ca hai pod cung xin GPU -> pod moi ket Pending vinh vien.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-g4-spec
  template:
    metadata:
      labels:
        app: vllm-g4-spec
        lab: "07-gemma4-spec"
    spec:
      # Tat viec K8s tiem bien moi truong cho moi Service trong namespace:
      # vLLM thay prefix VLLM_ nen log hang loat WARNING vo hai nhung gay
      # hoang mang.
      enableServiceLinks: false
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.29.0
          imagePullPolicy: IfNotPresent
          command: ["vllm", "serve"]
          args:
            - /models/google/gemma-4-26B-A4B-it-fp8-dynamic
            - --served-model-name=gemma4-26b-a4b
            - --host=0.0.0.0
            - --port=8000
            - --trust-remote-code

            # ---- TP1: mot engine = DUNG 1 GPU ----
            # Trong so FP8 chi 28.6GB -> thua suc vua 1 H100 80GB.
            # Giu TP1 xuyen suot de moi so sanh deu tren cung mot don vi
            # phan cung.
            - --tensor-parallel-size=1

            # ---- Ngan sach bo nho (H100 80GB) ----
            # 0.89 (bai 06 dung 0.90): chua cho trong so drafter 839MB va
            # CUDA graph cua nhanh verify. Chi phai lui 0.01 vi drafter
            # KHONG co KV cache rieng - no doc ke KV cua target.
            - --gpu-memory-utilization=0.89
            - --max-model-len=131072
            # ---- KV cache dtype: KHONG dung fp8 o Phan 3 ----
            # Quy tac cung trong vllm/v1/attention/backends/fa_utils.py:306
            #   return (fa_version == 3 and SM90) or (fa_version == 4 and SM100)
            # tuc FP8 KV cache voi FLASH_ATTN chi hop le khi FA3+SM90 hoac
            # FA4+SM100. Gemma-4 co global_head_dim=512, ma FA3 chan o
            # head_size > 256, nen vLLM BUOC nang FA3 -> FA4 (fa_utils.py:127).
            # FA4 + SM90 (H100) + fp8 KV => bi loai tru:
            #   ValueError: Selected backend FLASH_ATTN is not valid.
            #   Reason: FP8 KV cache requires FA3 on SM90 or FA4 on SM100
            # Ep --flash-attn-version=3 cung vo ich: doan nang cap chay SAU
            # buoc override nen no lai quay ve 4.
            #
            # Doi lai: KV cache giam con khoang mot nua. Voi Gemma-4 van du
            # rong vi 25/30 layer bi chan o sliding_window=1024.
            # ---- attention-backend: BAT BUOC voi Gemma-4 tren H100 ----
            # Gemma-4 tach layer thanh NHIEU KV-cache group (sliding_window
            # 1024 cho 25/30 layer, full_attention cho 5 layer con lai). Khi
            # bat speculative decoding, vLLM chon FlashInfer cho group
            # sliding-window va engine chet ngay luc khoi dong:
            #   NotImplementedError: FlashInfer backend on SM90 currently
            #   crashes with sliding-window attention layers.
            # (flashinfer.py:887 chan cung khi window_left != -1 tren SM90;
            #  xem flashinfer-ai/flashinfer#3578)
            #
            # CAI BAY: bien moi truong VLLM_ATTENTION_BACKEND KHONG con ton
            # tai trong vLLM 0.29.0 - dat no se bi lo di AM THAM va engine
            # van crash y nguyen. Backend gio chi cau hinh duoc qua co
            # --attention-backend (hoac AttentionConfig.backend_per_kind cho
            # tung KV-cache group).
            #
            # Dat cho CA BA bai 06/07/08 de phep so sanh doi xung. Khong lam
            # lech ket qua: target von da chay FA4 = FLASH_ATTN, thay o log
            # bai 06 "Using FA4 for all layers to avoid mixed FA3/FA4 penalty".
            - --attention-backend=FLASH_ATTN

            # ---- Scheduling ----
            - --enable-prefix-caching
            - --max-num-batched-tokens=8192
            # 128: giong bai 01-05 de so sanh xuyen suot khoa hoc duoc.
            # Day la TRAN cua batch decode; bien thuc su duoc quet la
            # --max-concurrency o phia client.
            - --max-num-seqs=128

            # ---- MULTIMODAL: toi da 8 anh moi request ----
            # Mac dinh vLLM la 999 anh/modality. Con so do di vao buoc
            # profiling bo nho luc khoi dong, nen de mac dinh vua khong
            # thuc te vua lang phi ngan sach activation.
            # Gemma-4 dung 280 soft token cho moi anh (vision_soft_tokens
            # _per_image), nen 8 anh = 2.240 token placeholder.
            - '--limit-mm-per-prompt={"image":8,"video":0}'

            # ---- Reasoning + tool calling ----
            # Ten parser da dang ky trong vLLM 0.29.0 la "gemma4" cho CA HAI
            # (vllm/tool_parsers/__init__.py, vllm/reasoning/__init__.py).
            - --reasoning-parser=gemma4
            - --tool-call-parser=gemma4
            - --enable-auto-tool-choice

            # ======================================================
            # THAY DOI DUY NHAT SO VOI BAI 06 (ngoai gpu-mem-util)
            # ------------------------------------------------------
            # method=mtp : bat buoc phai la "mtp". vLLM doc config cua
            #              drafter, thay model_type=gemma4_assistant, tu
            #              viet lai thanh Gemma4MTPModel. Dat "gemma4_mtp"
            #              cung chay nhung se bi canh bao deprecated.
            # model      : PHAI tro tuong minh toi assistant. Neu bo trong,
            #              vLLM se lay chinh target lam draft (nhanh
            #              "self.model = target_model_config.model" o
            #              speculative.py:1106) - sai hoan toan.
            # num_speculative_tokens=4 : assistant co n_predict=1, tuc moi
            #              lan forward sinh DUNG 1 draft token; 4 token
            #              nghia la chay noi tiep 4 lan drafter truoc moi
            #              buoc verify.
            #
            #              VI SAO 4 chu khong phai 6: do thuc te voi nspec=6
            #              cho thay acceptance tat rat nhanh theo do sau.
            #              Per-position acceptance rate o tai cao nhat:
            #                  0.734, 0.423, 0.287, 0.222, 0.195, 0.174
            #              Tich luy:
            #                  1.73, 2.16, 2.44, 2.67, 2.86, 3.03
            #              Vi tri 5 va 6 chi them 0,37 token trong tong 3,03
            #              (12% loi ich) nhung ton 2/6 = 33% chi phi drafter.
            #              Day dung la dieu speculative.py:1318 canh bao:
            #              chay lap cung mot MTP layer lam acceptance rate
            #              tut nhanh theo do sau.
            #
            #              VI SAO 4 chu khong phai 8: A/B chay song song, cung
            #              sweep (sampling temperature 1.0 mac dinh):
            #                               K=4          K=8
            #                acceptance     3.21-3.34    4.03-4.08
            #                tok/s c=8..128 (K8/K4)      0.65-0.97x
            #                tok/s c=128    4740-4846    3892-4105
            #              K=8 chi thang TPOT o c=1-2 (2.11 -> 1.68 ms).
            #              Assistant MTP draft TUAN TU: 8 token = 8 luot
            #              drafter, va target phai verify 9 vi tri moi
            #              request; vi tri 5-8 chi duoc chap nhan 22-30%.
            #
            #              KHONG them draft_sample_method=probabilistic +
            #              rejection_sample_method=block (giup Qwen3.8
            #              DSpark +3-13%, xem bai 03): voi Gemma-4 A/B cho
            #              TPOT B/A ~1.00 va acceptance chi +4% (K=4) /
            #              +1% (K=8) - khong do duoc loi ich, ma probabilistic
            #              ton them bo nho de giu draft logits.
            #
            #              Vi sao spec decode dang gia voi MoE:
            #              - Drafter chi 4 layer, hidden 1024, DENSE va
            #                khong co KV rieng -> 4 lan forward van re hon
            #                nhieu so voi MOT buoc verify cua backbone 26B.
            #              - Moi buoc verify xu ly 5 token/sequence thay vi
            #                1. Voi MoE, nhieu token hon trong cung mot buoc
            #                = nhieu expert duoc cham hon = DAY ENGINE VE
            #                PHIA VUNG BAO HOA cua duong cong. Spec decode
            #                va batch lon cung giai mot bai toan o day.
            #
            #              Rang buoc bo nho: max-num-batched-tokens (8192)
            #              phai >= max-num-seqs x (N+1) = 128 x 5 = 640. OK.
            # ======================================================
            - '--speculative-config={"method":"mtp","model":"/models/speculators/google/gemma-4-26B-A4B-it-assistant","num_speculative_tokens":4}'
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            - name: VLLM_LOGGING_LEVEL
              value: "INFO"
            # Thu muc trong so duoc mount READ-ONLY -> cache torch.compile
            # phai ghi sang PVC rieng.
            - name: VLLM_CACHE_ROOT
              value: /cache
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "8"
              memory: 64Gi
              nvidia.com/gpu: 1
            limits:
              cpu: "16"
              memory: 96Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: model-cache
              mountPath: /models
              readOnly: true
            - name: vllm-cache
              mountPath: /cache
            - name: shm
              mountPath: /dev/shm
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            failureThreshold: 120
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
            readOnly: true
        - name: vllm-cache
          persistentVolumeClaim:
            claimName: vllm-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-g4-spec
  namespace: token-factory
  labels:
    app: vllm-g4-spec
spec:
  selector:
    app: vllm-g4-spec
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
