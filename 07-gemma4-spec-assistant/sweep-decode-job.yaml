# Quet duong cong throughput theo concurrency, chay bang Job.
#
# VI SAO LA JOB MA KHONG PHAI `kubectl exec`:
#   - `nohup ... &` trong kubectl exec bi GIET khi phien exec dong.
#   - `kubectl exec` chay foreground vai chuc phut thi dut ket noi
#     ("error dialing backend: dial tcp: lookup vpn-seed-server").
#   Job chay ben trong cluster nen mien nhiem ca hai van de, va co the
#   xem lai log bat cu luc nao bang `kubectl logs job/...`.
#
# Chay lai cho lab khac: doi hai bien LAB va BASE_URL o duoi, roi
#   kubectl delete job sweep-bench -n token-factory --ignore-not-found
#   kubectl apply -f sweep-job.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sweep-script
  namespace: token-factory
data:
  sweep.sh: |
    #!/usr/bin/env bash
    # Quet duong cong DECODE-ISOLATED - bien the cua sweep.sh.
    #
    # VI SAO CAN BAN NAY:
    #   sweep.sh dung SPEED-Bench throughput_8k: input ~8k token, output 4096
    #   -> ti le prefill:decode ~ 2:1. Trong che do agg, chunked prefill xen
    #   ke voi decode nen TPOT do duoc CHUA CA nhieu loan tu prefill. Duong
    #   cong thu duoc la duong cong HON HOP, khong phai duong cong decode.
    #
    #   Gia thuyet "vung phang cua MoE" la mot phat bieu ve RIENG decode. De
    #   kiem tra no can input NGAN va output DAI, cho prefill gan nhu bien mat:
    #       --random-input-len 128  --random-output-len 4096   (1 : 32)
    #
    # Doc cot B/TPOT (= concurrency / TPOT, tuc token decode moi ms):
    #   B/TPOT gan nhu KHONG DOI khi c tang -> CO vung phang
    #   B/TPOT tang gan tuyen tinh theo c    -> KHONG co vung phang
    #
    # Muc tieu KHONG phai tim throughput cao nhat, ma tim DIEM GAY cua vung
    # phang trong duong cong MoE. Doc ket qua nhu sau:
    #
    #   tok/s tang gan TUYEN TINH tu c1        -> khong co vung phang
    #                                          -> gia thuyet SAI, dung tai day,
    #                                             khong chay bai 07/08
    #   tok/s gan NHU KHONG DOI toi mot nguong -> co vung phang
    #                                          -> nguong do la diem can quet
    #                                             quanh no o bai 08
    #
    # Dung: ./sweep.sh <ten-lab> <url-base> [danh-sach-concurrency]
    #   ./sweep.sh 06-g4-agg http://vllm-g4-spec:8000
    set -euo pipefail

    LAB="${1:?can ten lab, vd 06-g4-agg}"
    BASE="${2:?can url, vd http://vllm-g4-spec:8000}"
    CLIST="${3:-1 2 4 8 16 24 32 48 64 96 128}"

    MODEL=gemma4-26b-a4b
    # --tokenizer BAT BUOC phai tro toi thu muc CUC BO. Neu bo trong, vllm bench
    # lay --model lam ten tokenizer va di tim tren HuggingFace:
    #   OSError: gemma4-26b-a4b is not a local folder and is not a valid model
    #   identifier listed on 'https://huggingface.co/models'
    # ("gemma4-26b-a4b" chi la --served-model-name, khong phai repo id.)
    TOKENIZER=/models/google/gemma-4-26B-A4B-it-fp8-dynamic
    # SpeedBench doi --dataset-path la THU MUC, khong phai file .jsonl; subset
    # chon rieng bang --dataset-subset (mac dinh la "qualitative").
    # Tro thang vao file se bao:
    #   ValueError: dataset_path ... is not a directory
    # Bo decode-isolated: KHONG dung speed-bench


    # So prompt PHAI ti le voi concurrency, khong the la hang so:
    # - c=1 voi 256 prompt thi mat hang gio
    # - c=128 voi 32 prompt thi chua kip dat trang thai on dinh da xong
    # Quy tac: 2 lan concurrency, kep trong [8, 256].
    #
    # He so 2 (khong phai 4) vi --speed-bench-output-len mac dinh la 4096
    # token MOI REQUEST. O c=1 voi TPOT ~8ms, mot request mat ~33 giay; 32
    # prompt se ngon 17 phut chi cho mot diem do. 8 request x 4096 token van
    # cho 32 nghin mau decode - thua du de uoc luong throughput on dinh.
    nprompts_for() {
      # KHONG gop thanh "local c=$1 n=$((c*4))": trong cung mot lenh local,
      # $c chua duoc gan khi $((c*4)) duoc tinh -> voi set -u se bao
      # "c: unbound variable".
      local c=$1
      local n=$(( c * 2 ))
      (( n < 8 ))   && n=8
      (( n > 256 )) && n=256
      echo $n
    }

    # CANH BAO: hai tien trinh benchmark chay chong nhau tren cung mot server
    # da tung cho ra 315,90 va 495,11 tok/s cho CUNG MOT cau hinh (lech 57%).
    # Luon kiem tra truoc khi do.
    if ps -eo pid,etime,args | grep -q "[b]ench serve"; then
      echo "!! DANG CO benchmark khac chay - dung lai de tranh nhiem ket qua:"
      ps -eo pid,etime,args | grep "[b]ench serve"
      exit 1
    fi

    for C in $CLIST; do
      OUT="/results/${LAB}-c${C}.json"
      NPROMPTS=$(nprompts_for "$C")
      echo "=========== ${LAB}  c=${C}  n=${NPROMPTS} ==========="
      # Ghi TOAN BO output ra file roi moi loc de hien thi. KHONG duoc
      # `... | grep ...` truc tiep: khi lenh loi, grep nuot sach thong bao va
      # Job chi chet lang le voi dung mot dong tieu de - rat kho chan doan.
      LOG="/results/${LAB}-c${C}.log"
      if ! vllm bench serve \
          --backend openai-chat \
          --base-url "$BASE" \
          --endpoint /v1/chat/completions \
          --model "$MODEL" \
          --tokenizer "$TOKENIZER" \
          --dataset-name random \
          --random-input-len 128 \
          --random-output-len 4096 \
          --num-prompts "$NPROMPTS" \
          --max-concurrency "$C" \
          --request-rate inf \
          --ignore-eos \
          --percentile-metrics ttft,tpot,itl,e2el \
          --save-result --result-filename "$OUT" \
          > "$LOG" 2>&1; then
        echo "!! LOI o c=${C}. 40 dong cuoi cua ${LOG}:"
        tail -40 "$LOG"
        exit 1
      fi
      grep -E "Successful|Output token throughput|Total Token|Mean TTFT|Median TTFT|Mean TPOT|Median TPOT|Median ITL|Median E2EL|P99" "$LOG" || true
    done
    echo "=== xong: /results/${LAB}-c*.json ==="
---
apiVersion: batch/v1
kind: Job
metadata:
  name: sweep-bench
  namespace: token-factory
spec:
  backoffLimit: 0          # loi thi DUNG han, khong chay lai nua de tranh
                           # hai lan benchmark chong len nhau
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      containers:
        - name: bench
          image: vllm/vllm-openai:v0.29.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              # Dataset speed_bench cua `vllm bench` can pandas (extras
              # vllm[bench]), khong co san trong image vllm/vllm-openai.
              #
              # KHONG dung `pip install` o day: node cua workshop KHONG ra
              # duoc PyPI (thu `urlopen("https://pypi.org/simple/pandas/")`
              # -> timeout), nen pip se treo vo han va Job dung hinh o trang
              # thai Running ma khong bao loi gi.
              #
              # Thay vao do doc pandas tu PVC bench-results, noi bai 00 da
              # dat san (xem README muc "Chuan bi thu vien offline").
              export PYTHONPATH=/results/pylibs:${PYTHONPATH:-}
              python3 -c "import pandas; print('pandas', pandas.__version__)"
              exec bash /script/sweep.sh "$LAB" "$BASE_URL"
          env:
            # ---- HAI BIEN DUY NHAT CAN DOI GIUA CAC BAI ----
            - name: LAB
              value: "07-g4-spec-dec"
            - name: BASE_URL
              value: "http://vllm-g4-spec:8000"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef: { name: hf-token, key: token }
          resources:
            requests: { cpu: "4", memory: 16Gi }
            limits:   { cpu: "8", memory: 32Gi }
          volumeMounts:
            - { name: script,   mountPath: /script }
            # /models CAN cho --tokenizer. Thieu mount nay, transformers coi
            # duong dan cuc bo la repo id cua HuggingFace va bao:
            #   OSError: Repo id must be in the form 'repo_name' or
            #   'namespace/repo_name': '/models/google/gemma-4-...'
            - { name: models,   mountPath: /models,   readOnly: true }
            - { name: datasets, mountPath: /datasets, readOnly: true }
            - { name: results,  mountPath: /results }
      volumes:
        - name: script
          configMap: { name: sweep-script, defaultMode: 0755 }
        - name: models
          persistentVolumeClaim: { claimName: model-cache, readOnly: true }
        - name: datasets
          persistentVolumeClaim: { claimName: bench-datasets, readOnly: true }
        - name: results
          persistentVolumeClaim: { claimName: bench-results }
