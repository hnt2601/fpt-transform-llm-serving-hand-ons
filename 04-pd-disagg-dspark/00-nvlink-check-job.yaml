# Kiểm tra node có NVLink giữa 2 GPU hay không, và ĐO băng thông P2P thật.
#
# Vì sao bài 04 cần bước này: PD disaggregation đẩy toàn bộ KV cache của
# mỗi request từ GPU prefill sang GPU decode. Băng thông đường truyền đó
# cộng thẳng vào TTFT. Có NVLink hay không quyết định chi phí này là
# ~10ms hay ~170ms cho một prompt 128k.
#
# Chạy: kubectl apply -f 00-nvlink-check-job.yaml
#       kubectl logs -f job/nvlink-check -n token-factory
apiVersion: batch/v1
kind: Job
metadata:
  name: nvlink-check
  namespace: token-factory
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: check
          image: vllm/vllm-openai:v0.29.0   # cần torch + CUDA để đo băng thông
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -uo pipefail

              echo "############ [1/4] GPU trên node ############"
              nvidia-smi --query-gpu=index,name,memory.total,compute_cap,pcie.link.gen.current,pcie.link.width.current \
                         --format=csv
              echo

              echo "############ [2/4] Ma trận topology ############"
              echo "Đọc ô giao giữa GPU0 và GPU1:"
              echo "  NV#  = NVLink, # là số link  -> NHANH NHẤT"
              echo "  PIX  = cùng PCIe switch"
              echo "  PXB  = qua nhiều PCIe switch"
              echo "  PHB  = qua PCIe host bridge"
              echo "  SYS  = qua QPI/UPI giữa 2 CPU socket -> CHẬM NHẤT"
              echo
              nvidia-smi topo -m
              echo

              echo "############ [3/4] Trạng thái NVLink ############"
              if nvidia-smi nvlink --status 2>/dev/null | grep -q "Link"; then
                nvidia-smi nvlink --status
              else
                echo "Không phát hiện NVLink trên các GPU này."
                echo "(Bình thường với H100 PCIe; H100 SXM thường có NVLink.)"
              fi
              echo

              echo "############ [4/4] Đo băng thông P2P thật ############"
              python3 - <<'PYEOF'
              import torch, time

              n = torch.cuda.device_count()
              print(f"torch thấy {n} GPU")
              for i in range(n):
                  print(f"  cuda:{i} = {torch.cuda.get_device_name(i)}")

              if n < 2:
                  print("\nCHỈ CÓ 1 GPU — bài 04 cần 2 GPU. Dừng.")
                  raise SystemExit(1)

              p2p = torch.cuda.can_device_access_peer(0, 1)
              print(f"\nGPU0 truy cập trực tiếp GPU1 (P2P): {p2p}")
              if not p2p:
                  print("  -> Không có P2P: dữ liệu phải đi vòng qua RAM của host.")

              MB, ITERS, WARMUP = 512, 20, 5
              elems = MB * 1024 * 1024 // 2          # float16 = 2 byte
              src = torch.empty(elems, dtype=torch.float16, device="cuda:0")
              dst = torch.empty(elems, dtype=torch.float16, device="cuda:1")

              for _ in range(WARMUP):
                  dst.copy_(src)
              torch.cuda.synchronize()

              t0 = time.perf_counter()
              for _ in range(ITERS):
                  dst.copy_(src)
              torch.cuda.synchronize()
              dt = time.perf_counter() - t0

              gb = MB / 1024 * ITERS
              bw = gb / dt
              print(f"\nBăng thông GPU0 -> GPU1: {bw:.1f} GB/s")
              print("  Tham chiếu:  NVLink 4 (H100 SXM) ~ 350-450 GB/s")
              print("               PCIe Gen5 x16       ~  45-55 GB/s")
              print("               PCIe Gen4 x16       ~  20-25 GB/s")

              # Quy ra chi phí truyền KV thực tế cho chuỗi bài này.
              # Qwen3.8-27B: 16/64 lớp có attention KV, 4 KV head, head_dim 256,
              # fp8 -> 16 * 2 * 4 * 256 * 1 byte = 32 KB/token.
              KV_KB_PER_TOKEN = 32
              print("\n--- Quy ra chi phí truyền KV (Qwen3.8-27B, kv-cache fp8) ---")
              print(f"{'prompt':>10} | {'KV size':>9} | {'thời gian truyền':>17}")
              print("-" * 44)
              for tokens in (8_000, 32_000, 131_072):
                  kv_gb = tokens * KV_KB_PER_TOKEN / 1024 / 1024
                  ms = kv_gb / bw * 1000
                  print(f"{tokens:>10,} | {kv_gb:>6.2f} GB | {ms:>14.1f} ms")

              print("\nSo con số cuối với TTFT bạn đo ở bài 01 cho cùng độ dài prompt.")
              print("Nếu nó chiếm > 20% TTFT, đường truyền giữa 2 GPU đang là nút thắt")
              print("và lợi ích của PD sẽ bị bào mòn đáng kể.")
              PYEOF
          resources:
            limits:
              nvidia.com/gpu: 2
            requests:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: 2
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 8Gi }
