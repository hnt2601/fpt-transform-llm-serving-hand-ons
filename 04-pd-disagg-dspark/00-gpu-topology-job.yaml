# Kiểm tra topology kết nối giữa 2 GPU.
# Tìm "NV#" giữa GPU0 và GPU1 -> có NVLink, KV transfer sẽ rất nhanh.
# Nếu chỉ thấy PHB/SYS -> đi qua PCIe, chậm hơn nhưng vẫn dùng được.
apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-topology
  namespace: token-factory
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: nvidia-smi
          image: nvidia/cuda:12.8.0-base-ubuntu24.04
          command: ["/bin/bash", "-c"]
          args:
            - |
              echo "===== GPUs ====="
              nvidia-smi --query-gpu=index,name,memory.total --format=csv,noheader
              echo
              echo "===== Topology ====="
              nvidia-smi topo -m
          resources:
            limits:
              nvidia.com/gpu: 2
