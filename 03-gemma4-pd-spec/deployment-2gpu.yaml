---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-g4-pd2
  namespace: token-factory
  labels: { app: vllm-g4-pd2, lab: "08-gemma4-pd-2gpu" }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm-g4-pd2
  template:
    metadata:
      labels: { app: vllm-g4-pd2, lab: "08-gemma4-pd-2gpu" }
    spec:
      enableServiceLinks: false
      containers:
        - name: engines
          image: vllm/vllm-openai:v0.29.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              MODEL=/models/RedHatAI/gemma-4-12B-it-FP8-Dynamic
              MAX_BATCHED=8192
              MAX_SEQS=128
              SPEC='{"method":"dspark","model":"/models/speculators/deepseek-ai/dspark_gemma4_12b_block7","num_speculative_tokens":7}'
              COMMON=(
                --served-model-name=gemma4-12b
                --host=0.0.0.0
                --trust-remote-code
                --tensor-parallel-size=1
                --gpu-memory-utilization=0.90
                --max-model-len=131072
                --attention-backend=FLASH_ATTN
                --block-size=128
                --enable-prefix-caching
                '--limit-mm-per-prompt={"image":8,"video":0,"audio":0}'
                --reasoning-parser=gemma4
                --tool-call-parser=gemma4
                --enable-auto-tool-choice
                "--speculative-config=$SPEC"
              )

              CUDA_VISIBLE_DEVICES=0,1 VLLM_NIXL_SIDE_CHANNEL_PORT=5557 \
              vllm serve "$MODEL" "${COMMON[@]}" --port=8001 \
                --max-num-batched-tokens=$MAX_BATCHED --max-num-seqs=$MAX_SEQS \
                '--kv-transfer-config={"kv_connector":"NixlConnector","kv_role":"kv_producer","kv_load_failure_policy":"fail"}' \
                2>&1 | sed -u 's/^/[P] /' &

              CUDA_VISIBLE_DEVICES=1,0 VLLM_NIXL_SIDE_CHANNEL_PORT=5558 \
              vllm serve "$MODEL" "${COMMON[@]}" --port=8002 \
                --max-num-batched-tokens=$MAX_BATCHED --max-num-seqs=$MAX_SEQS \
                '--kv-transfer-config={"kv_connector":"NixlConnector","kv_role":"kv_consumer","kv_load_failure_policy":"fail"}' \
                2>&1 | sed -u 's/^/[D] /' &

              wait -n
              echo "!! mot engine da thoat, dung container"
              exit 1
          env:
            - name: HF_TOKEN
              valueFrom: { secretKeyRef: { name: hf-token, key: token } }
            - name: VLLM_NIXL_SIDE_CHANNEL_HOST
              value: "127.0.0.1"
            - name: UCX_NET_DEVICES
              value: "all"
            - name: VLLM_CACHE_ROOT
              value: /cache
          ports:
            - { name: prefill, containerPort: 8001 }
            - { name: decode,  containerPort: 8002 }
          resources:
            requests: { cpu: "8", memory: 96Gi, nvidia.com/gpu: 2 }
            limits:   { cpu: "24", memory: 128Gi, nvidia.com/gpu: 2 }
          volumeMounts:
            - { name: model-cache, mountPath: /models, readOnly: true }
            - { name: vllm-cache,  mountPath: /cache }
            - { name: shm,         mountPath: /dev/shm }
          startupProbe:
            exec:
              command: ["sh", "-c", "curl -sf localhost:8001/health && curl -sf localhost:8002/health"]
            failureThreshold: 150
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["sh", "-c", "curl -sf localhost:8001/health && curl -sf localhost:8002/health"]
            periodSeconds: 10

        - name: router
          image: vllm/vllm-openai:v0.29.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              if ! command -v vllm-router >/dev/null 2>&1; then
                echo "==> cai vllm-router"
                (command -v uv >/dev/null 2>&1 && uv pip install --system vllm-router) \
                  || pip install --no-cache-dir vllm-router
              fi
              until curl -sf http://localhost:8001/health && curl -sf http://localhost:8002/health; do
                echo "waiting for engines..."; sleep 10; done
              exec vllm-router \
                --policy round_robin \
                --vllm-pd-disaggregation \
                --prefill http://localhost:8001 \
                --decode  http://localhost:8002 \
                --host 0.0.0.0 \
                --port 30000 \
                --intra-node-data-parallel-size 1
          ports:
            - { name: http, containerPort: 30000 }
          resources:
            requests: { cpu: "1", memory: 4Gi }
            limits:   { cpu: "4", memory: 8Gi }
          readinessProbe:
            tcpSocket: { port: 30000 }
            periodSeconds: 10
      volumes:
        - name: model-cache
          persistentVolumeClaim: { claimName: model-cache, readOnly: true }
        - name: vllm-cache
          persistentVolumeClaim: { claimName: vllm-cache }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 32Gi }
---
apiVersion: v1
kind: Service
metadata: { name: vllm-g4-pd2, namespace: token-factory }
spec:
  selector: { app: vllm-g4-pd2 }
  ports:
    - { name: http, port: 30000, targetPort: 30000 }
  type: ClusterIP
