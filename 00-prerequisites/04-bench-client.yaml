# Bench client: chứa vLLM CLI để chạy `vllm bench serve`.
# KHÔNG xin GPU — chỉ đóng vai client sinh tải.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench-client
  namespace: token-factory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bench-client
  template:
    metadata:
      labels:
        app: bench-client
    spec:
      # K8s tự tiêm biến môi trường cho mọi Service trong namespace
      # (Service `vllm-agg` -> VLLM_AGG_SERVICE_HOST, VLLM_AGG_PORT, ...).
      # vLLM thấy prefix VLLM_ nên log 8 dòng WARNING "Unknown vLLM
      # environment variable" ngay lúc khởi động — vô hại nhưng gây hoang
      # mang. Tắt hẳn việc tiêm biến đó.
      enableServiceLinks: false
      containers:
        - name: bench
          image: vllm/vllm-openai:v0.29.0   # workshop: image đã pull sẵn trên node
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c", "sleep infinity"]
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
            # Tokenizer đọc từ PVC để không phải gọi ra HuggingFace khi bench
            - name: MODEL_PATH
              value: /models/Qwen/Qwen3.8-27B-FP8
          volumeMounts:
            - name: model-cache
              mountPath: /models
              readOnly: true
            - name: bench-results
              mountPath: /results
          resources:
            requests:
              cpu: "8"      # client phải đủ mạnh, nếu không chính nó là bottleneck
              memory: 16Gi
            limits:
              cpu: "16"
              memory: 32Gi
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
        - name: bench-results
          persistentVolumeClaim:
            claimName: bench-results
