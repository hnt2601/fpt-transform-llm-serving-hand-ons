apiVersion: batch/v1
kind: Job
metadata:
  name: model-download
  namespace: token-factory
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: model-download
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      containers:
        - name: downloader
          image: vllm/vllm-openai:v0.29.0
          imagePullPolicy: IfNotPresent
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
          command: ["python3", "-c"]
          args:
            - |
              import subprocess
              from huggingface_hub import snapshot_download

              jobs = [
                  ("RedHatAI/gemma-4-12B-it-FP8-Dynamic",
                   "/models/RedHatAI/gemma-4-12B-it-FP8-Dynamic"),
                  ("deepseek-ai/dspark_gemma4_12b_block7",
                   "/models/speculators/deepseek-ai/dspark_gemma4_12b_block7"),
              ]
              for i, (repo, dst) in enumerate(jobs, 1):
                  print(f"==> [{i}/{len(jobs)}] {repo} -> {dst}", flush=True)
                  snapshot_download(repo, local_dir=dst)
                  subprocess.run(["du", "-sh", dst])
                  subprocess.run(["ls", "-la", dst])
              print("==> Download completed", flush=True)
          volumeMounts:
            - name: model-cache
              mountPath: /models
          resources:
            requests: { cpu: "2", memory: 4Gi }
            limits:   { cpu: "4", memory: 8Gi }
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
