---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: token-factory-model-weights
  labels:
    fpt.transform/role: model-weights
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: hps-local
  claimRef:
    namespace: token-factory
    name: model-cache
  hostPath:
    path: /mnt/hps/fp8_models
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-cache
  namespace: token-factory
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Gi
  storageClassName: hps-local
---
---
