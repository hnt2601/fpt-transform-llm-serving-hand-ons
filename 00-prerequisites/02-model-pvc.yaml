---
# PVC chứa trọng số model — tải 1 lần, dùng cho cả 4 bài.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-cache
  namespace: token-factory
spec:
  accessModes:
    - ReadWriteOnce          # đủ dùng vì mọi pod nằm trên cùng 1 node GPU
  resources:
    requests:
      storage: 120Gi         # Qwen3.8-27B-FP8 (~28GB) + DSpark drafter (~4GB) + dư
  # storageClassName: <SỬA CHO KHỚP CLUSTER CỦA BẠN>   # xem: kubectl get sc
---
# PVC nhỏ lưu kết quả benchmark JSON của cả 4 bài.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bench-results
  namespace: token-factory
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # storageClassName: <SỬA CHO KHỚP CLUSTER CỦA BẠN>
