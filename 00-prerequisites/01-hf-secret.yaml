# TEMPLATE THAM KHẢO — KHÔNG commit token thật vào git.
# Cách tạo được khuyến nghị:
#   kubectl create secret generic hf-token \
#     --from-literal=token="hf_xxxxxxxxxxxxxxxxxxxx" -n token-factory
#
# Trong môi trường production hãy dùng SealedSecret / ExternalSecret / Vault.
apiVersion: v1
kind: Secret
metadata:
  name: hf-token
  namespace: token-factory
type: Opaque
stringData:
  token: "<YOUR_HF_TOKEN>"
