# Xác minh trọng số đã có đủ và ĐÚNG ĐƯỜNG DẪN mà các bài 01-04 mong đợi.
# Chạy job này TRƯỚC khi deploy bài 01 — nó tiết kiệm cho bạn 10 phút
# chờ pod crash-loop vì sai một ký tự trong đường dẫn.
apiVersion: batch/v1
kind: Job
metadata:
  name: verify-models
  namespace: token-factory
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: verify
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              TARGET=/models/Qwen/Qwen3.8-27B-FP8
              DRAFT=/models/speculators/RedHatAI/Qwen3.8-27B-speculator.dspark-preview
              RC=0

              echo "===== [1/2] Target model ====="
              echo "Mong đợi: ${TARGET}"
              if [ -f "${TARGET}/config.json" ]; then
                echo "  OK  config.json"
                echo "  OK  số file safetensors: $(ls "${TARGET}" | grep -c safetensors)"
                # mtp.safetensors = MTP head tích hợp -> bài 02 dùng được
                if [ -f "${TARGET}/mtp.safetensors" ]; then
                  echo "  OK  mtp.safetensors (bài 02 dùng MTP head này)"
                else
                  echo "  CANH BAO: không thấy mtp.safetensors — bài 02 (MTP) có thể không chạy"
                fi
                echo "  dung lượng: $(du -sh "${TARGET}" 2>/dev/null | cut -f1)"
              else
                echo "  THIEU: không thấy ${TARGET}/config.json"
                RC=1
              fi
              echo

              echo "===== [2/2] DSpark speculator ====="
              echo "Mong đợi: ${DRAFT}"
              for f in config.json config.py model.safetensors; do
                if [ -f "${DRAFT}/${f}" ]; then
                  echo "  OK     ${f}"
                else
                  echo "  THIEU  ${f}"
                  RC=1
                fi
              done
              echo

              if [ "${RC}" != "0" ]; then
                echo "=================================================="
                echo "KHONG DAT."
                echo
                echo "Các thư mục có thể khớp, tìm dưới /models:"
                find /models -maxdepth 3 -iname "*Qwen3.8*" 2>/dev/null | head -20
                echo
                echo "Hai cách xử lý:"
                echo "  A. Layout khác mong đợi -> sửa đường dẫn trong deployment.yaml"
                echo "     của bài 01-04. README bài 00 mục 'Layout thư mục trọng số'"
                echo "     liệt kê đầy đủ các chỗ cần sửa."
                echo "  B. Trọng số chưa được stage"
                echo "     -> Lane tự học: chạy 03-model-download-job.yaml"
                echo "     -> Lane workshop: báo ban tổ chức"
                echo "=================================================="
                exit 1
              fi

              echo "=================================================="
              echo "DAT — trọng số đã sẵn sàng. Tiếp tục sang bài 01."
              echo "=================================================="
          volumeMounts:
            - name: model-cache
              mountPath: /models
              readOnly: true
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
            readOnly: true
