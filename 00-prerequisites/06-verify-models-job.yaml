# Xác minh trọng số đã có đủ và ĐÚNG ĐƯỜNG DẪN mà các bài 01-04 mong đợi.
# Chạy job này TRƯỚC khi deploy bài 01 — nó tiết kiệm cho bạn 10 phút
# chờ pod crash-loop vì sai một ký tự trong đường dẫn.
apiVersion: batch/v1
kind: Job
metadata:
  name: verify-models
  namespace: token-factory
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: verify
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              TARGET=/models/Qwen/Qwen3.8-27B-FP8
              DRAFT=/models/RedHatAI/Qwen3.8-27B-speculator.dspark
              RC=0

              echo "===== Cây thư mục thực tế dưới /models (2 cấp) ====="
              find /models -maxdepth 2 -type d 2>/dev/null | sort
              echo

              echo "===== [1/2] Target model ====="
              echo "Mong đợi: ${TARGET}"
              if [ -f "${TARGET}/config.json" ]; then
                echo "  OK  config.json"
                ls "${TARGET}" | grep -c safetensors | xargs echo "  OK  số file safetensors:"
                du -sh "${TARGET}" 2>/dev/null
              else
                echo "  THIEU: không thấy ${TARGET}/config.json"
                RC=1
              fi
              echo

              echo "===== [2/2] DSpark speculator ====="
              echo "Mong đợi: ${DRAFT}"
              for f in config.json config.py model.safetensors; do
                if [ -f "${DRAFT}/${f}" ]; then
                  echo "  OK     ${f}"
                else
                  echo "  THIEU  ${f}"
                  RC=1
                fi
              done
              echo

              if [ "${RC}" != "0" ]; then
                echo "=================================================="
                echo "KHONG DAT. Hai cách xử lý:"
                echo ""
                echo "  A. Layout trên host khác với mong đợi"
                echo "     -> Xem cây thư mục in ở đầu log, rồi sửa đường dẫn"
                echo "        trong các file deployment.yaml của bài 01-04."
                echo "        Có đúng 3 chỗ cần sửa mỗi bài — README bài 00"
                echo "        mục 'Điều chỉnh đường dẫn' liệt kê đầy đủ."
                echo ""
                echo "  B. Trọng số chưa được stage"
                echo "     -> Lane tự học: chạy 03-model-download-job.yaml"
                echo "     -> Lane workshop: báo ban tổ chức"
                echo "=================================================="
                exit 1
              fi

              echo "=================================================="
              echo "DAT — trọng số đã sẵn sàng. Tiếp tục sang bài 01."
              echo "=================================================="
          volumeMounts:
            - name: model-cache
              mountPath: /models
              readOnly: true
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
