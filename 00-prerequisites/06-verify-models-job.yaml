apiVersion: batch/v1
kind: Job
metadata:
  name: verify-models
  namespace: token-factory
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: verify
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              TARGET=/models/RedHatAI/gemma-4-12B-it-FP8-Dynamic
              DRAFT=/models/speculators/deepseek-ai/dspark_gemma4_12b_block7
              RC=0

              echo "===== [1/2] Target model ====="
              echo "Mong đợi: ${TARGET}"
              for f in config.json model.safetensors processor_config.json tokenizer.json; do
                if [ -f "${TARGET}/${f}" ]; then
                  echo "  OK     ${f}"
                else
                  echo "  THIEU  ${f}"
                  RC=1
                fi
              done
              echo "  dung lượng: $(du -sh "${TARGET}" 2>/dev/null | cut -f1)"
              echo

              echo "===== [2/2] DSpark drafter ====="
              echo "Mong đợi: ${DRAFT}"
              for f in config.json model.safetensors; do
                if [ -f "${DRAFT}/${f}" ]; then
                  echo "  OK     ${f}"
                else
                  echo "  THIEU  ${f}"
                  RC=1
                fi
              done
              grep -o '"block_size": *[0-9]*' "${DRAFT}/config.json" 2>/dev/null | sed 's/^/  /'
              echo

              if [ "${RC}" != "0" ]; then
                echo "=================================================="
                echo "KHONG DAT."
                echo
                echo "Các thư mục có thể khớp, tìm dưới /models:"
                find /models -maxdepth 3 \( -iname "*gemma-4-12B*" -o -iname "*dspark_gemma4*" \) 2>/dev/null | head -20
                echo
                echo "Hai cách xử lý:"
                echo "  A. Layout khác mong đợi -> sửa đường dẫn trong deployment của"
                echo "     bài 01-03. README bài 00 mục 'Layout thư mục trọng số'"
                echo "     liệt kê đầy đủ các chỗ cần sửa."
                echo "  B. Trọng số chưa được stage"
                echo "     -> Lane tự học: chạy 03-model-download-job.yaml"
                echo "     -> Lane workshop: báo ban tổ chức"
                echo "=================================================="
                exit 1
              fi

              echo "=================================================="
              echo "DAT — trọng số đã sẵn sàng. Tiếp tục sang bài 01."
              echo "=================================================="
          volumeMounts:
            - name: model-cache
              mountPath: /models
              readOnly: true
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
            readOnly: true
